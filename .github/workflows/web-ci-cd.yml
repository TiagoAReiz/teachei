name: Web Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'teachei-web/**'
      - '.github/workflows/web-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'teachei-web/**'
      - '.github/workflows/web-ci-cd.yml'

jobs:
  # ========================================
  # Build and Lint (Vercel handles deployment automatically)
  # ========================================
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./teachei-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: teachei-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` executa `prisma db push`, que exige um banco real.
      # No CI geramos apenas o client Prisma e compilamos o Next.js com
      # valores fictícios (nenhum acesso a banco/Supabase é feito no build).
      - name: Build
        run: npx prisma generate && npx next build
        env:
          NEXT_PUBLIC_API_URL: ''
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-secret-with-32-plus-chars
