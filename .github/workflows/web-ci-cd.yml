name: Web Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'teachei-web/**'
      - '.github/workflows/web-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'teachei-web/**'

jobs:
  # ========================================
  # Build and Lint (Vercel handles deployment automatically)
  # ========================================
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./teachei-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: teachei-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://teachei-api.azurecontainerapps.io' }}
