# TeAchei API Configuration - v1.0.1
spring:
  application:
    name: teachei-api

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:require}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-http-form-content-size: 5MB
    max-swallow-size: 5MB

# Azure Cosmos DB Configuration
azure:
  cosmos:
    uri: ${COSMOS_ENDPOINT}
    key: ${COSMOS_KEY}
    database: ${COSMOS_DATABASE}
    populate-query-metrics: ${COSMOS_POPULATE_QUERY_METRICS:false}
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    blob-endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT}
    containers:
      profile-photos: ${AZURE_STORAGE_PROFILE_PHOTOS_CONTAINER:profile-photos}
      vehicle-photos: ${AZURE_STORAGE_VEHICLE_PHOTOS_CONTAINER:vehicle-photos}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRATION_HOURS:1}

# Mercado Pago Configuration
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  public-key: ${MERCADOPAGO_PUBLIC_KEY}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET}

# FIPE API Configuration
fipe:
  base-url: ${FIPE_API_BASE_URL:https://parallelum.com.br/fipe/api/v1}

# Application URLs
app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  cors-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    secret: ${APP_ADMIN_SECRET:}

# Payment Configuration
payment:
  price-per-ad: ${PAYMENT_PRICE_PER_AD:2.00}
  intention-expiry-days: ${INTENTION_EXPIRY_DAYS:60}

# Subscription Plans Configuration (prices in centavos)
subscription:
  plans:
    individual:
      price: ${SUBSCRIPTION_INDIVIDUAL_PRICE:200}
      duration-days: 30
      recurring: false
    quarterly:
      price: ${SUBSCRIPTION_QUARTERLY_PRICE:3000}
      duration-days: 90
      recurring: true
    annual:
      price: ${SUBSCRIPTION_ANNUAL_PRICE:9000}
      duration-days: 365
      recurring: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      fipe:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      fipe:
        max-attempts: 3
        wait-duration: 1s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.teachei: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

mercadopago:
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:dev-secret-not-for-production}

logging:
  level:
    com.teachei: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.teachei: INFO
    org.hibernate.SQL: WARN


