# TeAchei API Configuration - v1.0.1
spring:
  application:
    name: teachei-api

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:teachei}?sslmode=require
    username: ${POSTGRES_USER:teachei}
    password: ${POSTGRES_PASSWORD:teachei123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-http-form-content-size: 5MB
    max-swallow-size: 5MB

# Azure Cosmos DB Configuration
azure:
  cosmos:
    uri: ${COSMOS_ENDPOINT:https://localhost:8081}
    key: ${COSMOS_KEY:C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
    database: ${COSMOS_DATABASE:teachei}
    populate-query-metrics: false
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
    blob-endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:http://127.0.0.1:10000/devstoreaccount1}
    containers:
      profile-photos: profile-photos
      vehicle-photos: vehicle-photos

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
  expiration-hours: ${JWT_EXPIRATION_HOURS:1}

# Mercado Pago Configuration
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-access-token}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:TEST-public-key}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

# FIPE API Configuration
fipe:
  base-url: ${FIPE_API_BASE_URL:https://parallelum.com.br/fipe/api/v1}

# Application URLs
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,https://teachei.shop}
  admin:
    secret: ${APP_ADMIN_SECRET:}

# Payment Configuration
payment:
  price-per-ad: ${PAYMENT_PRICE_PER_AD:2.00}
  intention-expiry-days: ${INTENTION_EXPIRY_DAYS:60}

# Subscription Plans Configuration (prices in centavos)
subscription:
  plans:
    individual:
      price: ${SUBSCRIPTION_INDIVIDUAL_PRICE:200}
      duration-days: 30
      recurring: false
    quarterly:
      price: ${SUBSCRIPTION_QUARTERLY_PRICE:3000}
      duration-days: 90
      recurring: true
    annual:
      price: ${SUBSCRIPTION_ANNUAL_PRICE:9000}
      duration-days: 365
      recurring: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      fipe:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      fipe:
        max-attempts: 3
        wait-duration: 1s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.teachei: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    com.teachei: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.teachei: INFO
    org.hibernate.SQL: WARN



